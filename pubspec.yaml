name: campushub
description: "CampusHub - Privacy-first private campus network exclusively for university freshmen"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Local Persistence & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Utilities & Cryptography
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  crypto: ^3.0.3

  # Icons & UI Polish
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
